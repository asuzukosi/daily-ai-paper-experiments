[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "declarative-attention"
version = "0.1.0"
description = "Declarative Attention (arXiv:2609.02737) — protocol helpers + experiment scaffolding"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Kosi Asuzu / DAIR daily papers" }]
dependencies = [
  "pyyaml>=6.0",
]

[project.optional-dependencies]
gpu = [
  "torch>=2.2.0",
  "transformers>=4.44.0",
  "accelerate>=0.33.0",
  "sentencepiece>=0.2.0",
  "huggingface_hub>=0.24.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"
